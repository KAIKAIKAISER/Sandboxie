[package]
name = "diskguard"
version = "0.1.0"
description = "Independent Tauri controller for the Sandboxie runtime"
authors = ["DiskGuard contributors"]
edition = "2021"
license = "GPL-3.0-or-later"
default-run = "diskguard"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
csv = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Services", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
