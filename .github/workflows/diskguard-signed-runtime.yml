name: DiskGuard signed runtime verification

on:
  workflow_dispatch:
    inputs:
      run_signed_runtime_tests:
        description: Install the pinned official signed Sandboxie runtime on this disposable GitHub-hosted VM and execute enforcement probes
        type: boolean
        required: true
        default: false
      build_run_id:
        description: Optional successful DiskGuard build run ID whose portable UI should execute the actual Rust adapter diagnostics
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  signed-runtime:
    if: inputs.run_signed_runtime_tests && github.repository != 'sandboxie-plus/Sandboxie'
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Capture relevant processes before runtime installation
        run: ./DiskGuard/scripts/Get-RuntimeProcessEvidence.ps1 -Destination (Join-Path $env:GITHUB_WORKSPACE 'DiskGuard/work/hosted-runtime/processes-before-install.json')
      - name: Install pinned official runtime after hash and signature verification
        id: install-runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./DiskGuard/scripts/Install-HostedRuntime.ps1
      - name: Capture relevant processes after runtime installation
        if: always()
        run: ./DiskGuard/scripts/Get-RuntimeProcessEvidence.ps1 -Destination (Join-Path $env:GITHUB_WORKSPACE 'DiskGuard/work/hosted-runtime/processes-after-install.json')
      - name: Capture the cold session before native application tests
        if: always() && steps['install-runtime'].outcome == 'success' && inputs.build_run_id != ''
        run: ./DiskGuard/scripts/Get-RuntimeProcessEvidence.ps1 -Destination (Join-Path $env:GITHUB_WORKSPACE 'DiskGuard/work/hosted-runtime/processes-before-native.json')
      - name: Execute the built application's actual Sandboxie adapter
        if: always() && steps['install-runtime'].outcome == 'success' && inputs.build_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: ./DiskGuard/scripts/Test-BuiltAdapter.ps1 -BuildRunId $env:BUILD_RUN_ID -VerifyColdSession
      - name: Capture relevant processes after native application tests
        if: always() && steps['install-runtime'].outcome == 'success' && inputs.build_run_id != ''
        run: ./DiskGuard/scripts/Get-RuntimeProcessEvidence.ps1 -Destination (Join-Path $env:GITHUB_WORKSPACE 'DiskGuard/work/hosted-runtime/processes-after-native.json')
      - name: Execute real file access and process association tests
        if: always() && steps['install-runtime'].outcome == 'success'
        run: ./DiskGuard/scripts/Test-Runtime.ps1 -AcknowledgeDisposableVm -EvidenceDirectory (Join-Path $env:GITHUB_WORKSPACE 'DiskGuard/work/hosted-runtime/runtime-results')
      - name: Collect actual driver/service diagnostics
        if: always()
        run: |
          $directory = Join-Path $env:GITHUB_WORKSPACE 'DiskGuard/work/hosted-runtime'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          Get-CimInstance Win32_SystemDriver -Filter "Name='SbieDrv'" | Select-Object Name, State, Status, StartMode, PathName | ConvertTo-Json | Set-Content (Join-Path $directory 'driver-state.json')
          Get-CimInstance Win32_Service -Filter "Name='SbieSvc'" | Select-Object Name, State, Status, StartMode, PathName | ConvertTo-Json | Set-Content (Join-Path $directory 'service-state.json')
          Get-WinEvent -FilterHashtable @{LogName='System'; StartTime=(Get-Date).AddMinutes(-25); Level=1,2,3} -ErrorAction SilentlyContinue | Select-Object TimeCreated, Id, ProviderName, Message | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $directory 'system-errors.json')
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-25); Level=1,2,3} -ErrorAction SilentlyContinue | Select-Object TimeCreated, Id, ProviderName, Message | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $directory 'application-errors.json')
          Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-CodeIntegrity/Operational'; StartTime=(Get-Date).AddMinutes(-25)} -ErrorAction SilentlyContinue | Select-Object TimeCreated, Id, ProviderName, Message | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $directory 'code-integrity-events.json')
      - name: Upload runtime evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diskguard-signed-runtime-evidence-${{ github.run_id }}
          path: |
            DiskGuard/work/hosted-runtime/*.json
            DiskGuard/work/hosted-runtime/*.txt
            DiskGuard/work/hosted-runtime/runtime-results/*.json
            DiskGuard/work/hosted-runtime/runtime-results/*.jsonl
            DiskGuard/work/hosted-runtime/runtime-results/*.txt
            DiskGuard/work/hosted-runtime/runtime-results/results/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Record scope without overstating Windows client validation
        if: always()
        run: |
          @'
          ## Signed runtime verification
          A pass requires a trusted driver, successful real allowed/denied file access probes, sandbox launch, forced process launch, and child sandbox association.
          Missing/unloadable drivers and probe errors fail this job; they are never converted into a passing skipped test.
          This is a Windows Server 2022 hosted VM result, not Windows 10/11 client or QQ/WeChat UI compatibility validation.
          No driver signing enforcement setting was changed. See uploaded evidence for the exact runtime and actual results.
          '@ >> $env:GITHUB_STEP_SUMMARY
