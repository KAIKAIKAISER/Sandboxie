name: DiskGuard Windows x64

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['diskguard-v[0-9]*']
    paths:
      - 'DiskGuard/**'
      - '.github/workflows/diskguard*.yml'
      - '.github/dependabot.yml'
  pull_request:
    paths:
      - 'DiskGuard/**'
      - '.github/workflows/diskguard*.yml'
      - '.github/dependabot.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: diskguard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  security:
    if: github.repository != 'sandboxie-plus/Sandboxie'
    uses: ./.github/workflows/diskguard-security.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  build:
    # This workflow belongs to the downstream UI, never the upstream publisher.
    if: github.repository != 'sandboxie-plus/Sandboxie'
    runs-on: windows-2022
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: DiskGuard/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: '1.99.1'
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: 'DiskGuard/src-tauri -> target'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/diskguard-v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content DiskGuard/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne "diskguard-v$version") {
            throw "Tag $env:RELEASE_TAG does not match application version $version"
          }
      - name: Validate, test and package the independent UI
        run: ./DiskGuard/scripts/Build.ps1
      - name: Capture frontend pages for font and layout review
        run: |
          node DiskGuard/ui/node_modules/playwright/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Visual review browser installation failed' }
          npm --prefix DiskGuard/ui run test:ui
          if ($LASTEXITCODE -ne 0) { throw 'Frontend regression tests failed' }
          node DiskGuard/scripts/Capture-UiReview.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Visual review capture failed' }
      - name: Upload frontend review screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diskguard-ui-review-${{ github.sha }}
          path: |
            DiskGuard/work/ui-review-captures/**
            DiskGuard/ui/test-results/**
          if-no-files-found: warn
          retention-days: 30
      - name: Compile the isolated VM probe (does not execute a driver test)
        run: |
          dotnet build DiskGuard/scripts/probe/RuntimeProbe.csproj --configuration Release --nologo 2>&1 | Tee-Object -FilePath DiskGuard/build-logs/runtime-probe-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Runtime probe compilation failed' }
      - name: Upload Windows x64 installer and portable UI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diskguard-windows-x64-${{ github.sha }}
          path: DiskGuard/dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload complete build transcript even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diskguard-build-logs-${{ github.sha }}
          path: DiskGuard/build-logs/**
          if-no-files-found: warn
          retention-days: 30
      - name: Explain validation scope
        if: always()
        run: |
          @'
          ## DiskGuard validation scope
          This job compiles the Rust/Tauri UI, runs its unit tests, and packages the pinned official runtime with x64 NSIS/portable artifacts.
          SHA-256 and Authenticode are checked before bundling. No Sandboxie driver is built, installed, test-signed, or loaded on this build runner.
          Separate clean-machine jobs validate integrated installation and real access control before tagged release publication.
          The UI executables are unsigned unless a separate publisher signing process is added.
          '@ >> $env:GITHUB_STEP_SUMMARY

  bundled-runtime:
    if: github.repository != 'sandboxie-plus/Sandboxie' && github.event_name != 'pull_request'
    needs: build
    uses: ./.github/workflows/diskguard-integrated-runtime.yml
    with:
      build_run_id: '${{ github.run_id }}'

  release:
    if: startsWith(github.ref, 'refs/tags/diskguard-v') && github.event_name == 'push'
    needs: [build, bundled-runtime, quality-gate]
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: diskguard-windows-x64-${{ github.sha }}
          path: release-assets
      - name: Publish tagged UI release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $notes = @'
          Independent Rust + Tauri 2 DiskGuard UI for Windows 10/11 x64.

          Pre-release: Windows client acceptance and publisher signing remain separate release requirements.

          Includes the unmodified official signed Sandboxie Classic x64 5.73.8 installer.
          The setup package installs a missing runtime through normal Windows administrator authorization; portable users can select Install bundled runtime in the application.
          Existing runtimes are preserved. Microsoft Edge WebView2 is also required; setup installs it if needed.
          The upstream driver is not rebuilt or re-signed. Windows driver signing enforcement remains enabled. No Qt UI is included.
          Clean-machine installer and portable deployment checks must pass before this release job can run.
          Complete corresponding runtime source: https://github.com/sandboxie-plus/Sandboxie/archive/refs/tags/v1.18.8.zip
          The DiskGuard application binaries are unsigned. Windows Server cloud tests do not establish Windows 10/11 or QQ/WeChat business compatibility.
          See BUILD-MANIFEST.json, SHA256SUMS.txt and the source documentation for exact build and test scope.
          '@
          $notes | Set-Content -LiteralPath release-notes.md -Encoding utf8
          $assets = @(Get-ChildItem -LiteralPath release-assets -File | ForEach-Object { $_.FullName })
          $version = $env:RELEASE_TAG.Substring('diskguard-v'.Length)
          $expectedNames = @('BUILD-MANIFEST.json', 'SHA256SUMS.txt', "DiskGuard_${version}_x64-setup.exe", "DiskGuard_${version}_windows-x64-portable.zip")
          $actualNames = @(Get-ChildItem -LiteralPath release-assets -File | ForEach-Object { $_.Name })
          if ($assets.Count -ne 4 -or @(Compare-Object $expectedNames $actualNames).Count -ne 0) { throw 'Release artifact set differs from the exact tagged version' }
          $manifest = Get-Content release-assets/BUILD-MANIFEST.json -Raw | ConvertFrom-Json
          if ($manifest.source_commit -cne $env:RELEASE_SHA -or $manifest.version -cne $version) { throw 'Release manifest source/version mismatch' }
          $checked = @()
          foreach ($line in Get-Content release-assets/SHA256SUMS.txt) {
            if ($line -notmatch '^([a-fA-F0-9]{64})  (.+)$') { throw 'Malformed release checksum' }
            $hash = $Matches[1]
            $name = $Matches[2]
            if ($name -notin $expectedNames -or $name -eq 'SHA256SUMS.txt' -or $checked -contains $name) { throw 'Unexpected or duplicate checksum target' }
            if ((Get-FileHash -LiteralPath (Join-Path release-assets $name) -Algorithm SHA256).Hash -ine $hash) { throw "Release checksum mismatch: $name" }
            $checked += $name
          }
          if ($checked.Count -ne 3) { throw 'Release checksums do not cover all payloads and the manifest' }
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to replace published assets' }
          gh release create $env:RELEASE_TAG @assets --repo $env:GH_REPO --verify-tag --target $env:RELEASE_SHA --title "DiskGuard $env:RELEASE_TAG" --notes-file release-notes.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }

  quality-gate:
    name: DiskGuard quality gate
    if: always() && github.repository != 'sandboxie-plus/Sandboxie'
    needs: [build, security, bundled-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          RUNTIME_RESULT: ${{ needs.bundled-runtime.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$BUILD_RESULT" = success
          test "$SECURITY_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$RUNTIME_RESULT" = skipped
          else
            test "$RUNTIME_RESULT" = success
          fi
