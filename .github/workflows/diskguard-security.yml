name: DiskGuard dependency and source security

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 2'

permissions:
  contents: read

jobs:
  dependencies:
    if: github.repository != 'sandboxie-plus/Sandboxie'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: '1.99.1'
      - name: Audit locked frontend dependencies
        working-directory: DiskGuard/ui
        shell: bash
        run: npm audit --package-lock-only --ignore-scripts --audit-level=high | tee npm-audit.txt
      - name: Install pinned RustSec client and audit locked Rust dependencies
        shell: bash
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file DiskGuard/src-tauri/Cargo.lock 2>&1 | tee cargo-audit.txt
      - name: Record the shipped target dependency graph
        run: cargo tree --manifest-path DiskGuard/src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc > windows-dependency-tree.txt
      - name: Preserve audit results including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diskguard-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            DiskGuard/ui/npm-audit.txt
            cargo-audit.txt
            windows-dependency-tree.txt
          if-no-files-found: warn
          retention-days: 30

  codeql:
    if: github.repository != 'sandboxie-plus/Sandboxie'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}/diskguard
